server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

gamestar:
  routes:
    api-uri: ${GAMESTAR_API_URI:lb://GAMESTAR-API}
    recommendation-uri: ${RECOMMENDATION_URI:lb://RECOMMENDATION-SERVICE}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
